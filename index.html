<!DOCTYPE html>
<html>
<head>
    <title>PotholeWatch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <h1>🕳️ PotholeWatch</h1>
    <p class="subtitle">Live road condition detection</p>

    <div class="camera-box">
        <video id="camera" autoplay playsinline></video>
    </div>

    <button class="start-button" onclick="startDetection()">
        📹 Start Live Detection
    </button>

    <div class="status">
        <span id="status">Detection stopped</span>
    </div>

    <div class="info">
        <h3>📍 Current Location</h3>
        <p id="location">Waiting for GPS...</p>
    </div>

    <div class="info">
        <h3>🕐 Last Detection</h3>
        <p id="time">No detection yet</p>
    </div>

</div>

<script>

let camera = document.getElementById("camera");

let latitude = null;
let longitude = null;

let gpsWatcher = null;
let detectionInterval = null;


// START CAMERA + GPS
function startDetection() {

    // Start camera
    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "environment"
        }
    })
    .then(function(stream) {

        camera.srcObject = stream;

        document.getElementById("status").innerHTML =
            "🟢 Live detection running";

    })
    .catch(function(error) {

        alert("Camera permission denied.");

        console.log(error);
    });


    // Start GPS tracking
    gpsWatcher = navigator.geolocation.watchPosition(

        function(position) {

            latitude = position.coords.latitude;
            longitude = position.coords.longitude;

            document.getElementById("location").innerHTML =
                "Latitude: " + latitude.toFixed(6) +
                "<br>" +
                "Longitude: " + longitude.toFixed(6);

        },

        function(error) {

            document.getElementById("location").innerHTML =
                "❌ GPS unavailable";

            console.log(error);

        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }

    );


    // FOR NOW:
    // Assume a pothole is detected every second

    detectionInterval = setInterval(function() {

        if (latitude !== null && longitude !== null) {

            let currentTime = new Date();

            document.getElementById("time").innerHTML =
                currentTime.toLocaleString();

            console.log({
                pothole: true,
                latitude: latitude,
                longitude: longitude,
                time: currentTime.toISOString()
            });

        }

    }, 1000);

}

</script>

</body>
</html>
