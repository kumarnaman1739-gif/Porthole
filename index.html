<!DOCTYPE html>
<html>
<head>
    <title>Pothole Detection</title>
</head>

<body>

    <h1>Pothole Detection</h1>

    <h2>Camera</h2>

    <video id="camera" width="300" autoplay playsinline></video>

    <br><br>

    <button onclick="startCamera()">
        Start Camera
    </button>

    <button onclick="takePhoto()">
        Take Photo
    </button>

    <br><br>

    <canvas id="photo" width="300"></canvas>

    <h3>Pothole Information</h3>

    <p id="location">
        Location not captured
    </p>

    <p id="time">
        Time not captured
    </p>

    <h3>Data Created</h3>

    <pre id="data">
No pothole data yet.
    </pre>


    <script>

    // =========================
    // CAMERA
    // =========================

    let camera = document.getElementById("camera");

    function startCamera() {

        navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "environment"
            }

        })

        .then(function(stream) {

            camera.srcObject = stream;

        })

        .catch(function(error) {

            alert("Camera permission denied or camera not available.");

        });
    }


    // =========================
    // TAKE PHOTO
    // =========================

    function takePhoto() {

        let canvas = document.getElementById("photo");

        let context = canvas.getContext("2d");

        // Capture camera frame
        context.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Convert photo into data
        let imageData = canvas.toDataURL("image/jpeg");


        // =========================
        // GET GPS
        // =========================

        navigator.geolocation.getCurrentPosition(

            function(position) {

                let latitude = position.coords.latitude;
                let longitude = position.coords.longitude;

                let currentTime = new Date().toISOString();


                // =========================
                // CREATE POTHOLE DATA
                // =========================

                let potholeData = {

                    image: imageData,

                    latitude: latitude,

                    longitude: longitude,

                    time: currentTime

                };


                // Show location
                document.getElementById("location").innerHTML =
                    "Latitude: " + latitude +
                    "<br>Longitude: " + longitude;


                // Show time
                document.getElementById("time").innerHTML =
                    "Time: " + currentTime;


                // Show complete data
                document.getElementById("data").textContent =
                    JSON.stringify(potholeData, null, 2);


                console.log(potholeData);
            },


            function(error) {

                document.getElementById("location").innerHTML =
                    "Could not get location.";

            }
        );
    }

    </script>

</body>
</html>
