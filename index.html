<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PotholeWatch</title>

    <link rel="stylesheet" href="style.css">

    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        /* =====================================================
           CAMERA OVERLAY FIX
           ===================================================== */

        .camera-box {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        #camera {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🕳️ PotholeWatch</h1>
    <p class="subtitle">Live AI road condition detection</p>

    <!-- =====================================================
         CAMERA
         ===================================================== -->

    <div class="camera-box">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas id="overlay"></canvas>

    </div>


    <button
        class="start-button"
        id="startButton"
        onclick="startDetection()">

        📹 Start Live Detection

    </button>


    <div class="status">

        <span id="status">
            Loading AI model...
        </span>

    </div>


    <div class="info">

        <h3>📍 Current Location</h3>

        <p id="location">
            Waiting for GPS...
        </p>

    </div>


    <div class="info">

        <h3>🕐 Last Report Sent</h3>

        <p id="lastSent">
            Nothing sent yet
        </p>

    </div>


    <div class="info">

        <h3>📦 Reports Waiting</h3>

        <p id="reportCount">
            0
        </p>

    </div>


    <div class="info">

        <h3>🕳️ Detection Log</h3>

        <div id="reportLog"></div>

    </div>

</div>


<script>

// ============================================================
// SETTINGS
// ============================================================

const MODEL_PATH =
    "model/best.onnx";

const API_URL =
    "https://bus2city-ai.onrender.com/reports";

const BUS_ID =
    "BUS_01";

const INPUT_SIZE =
    640;


// Minimum confidence required
const CONFIDENCE_THRESHOLD =
    0.30;


// Non-Maximum Suppression
const NMS_IOU_THRESHOLD =
    0.45;


// ============================================================
// OLD RAPID-DETECTION PROTECTION
// ============================================================
//
// This is still kept as an extra safety layer.
//
// The NEW tracking system below is what actually prevents
// the same pothole from being reported repeatedly.
//

const DETECTION_COOLDOWN =
    3000;


// Send collected reports every 60 seconds
const REPORT_INTERVAL =
    60000;


// ============================================================
// POTHOLE TRACKING SETTINGS
// ============================================================
//
// IMPORTANT:
//
// These are NOT GPS distances.
//
// They are distances between the pothole's position
// inside consecutive camera frames.
//
// 150 pixels means:
// "If the pothole moves less than roughly 150 pixels
// between frames, it can still be the same pothole."
//

const TRACK_DISTANCE_PIXELS =
    150;


// How long we remember a pothole if it temporarily
// disappears from detection.
//
// 2 seconds.
//

const TRACK_LOST_TIME =
    2000;


// ============================================================
// HTML ELEMENTS
// ============================================================

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const statusText =
    document.getElementById("status");

const locationText =
    document.getElementById("location");

const reportCount =
    document.getElementById("reportCount");

const lastSent =
    document.getElementById("lastSent");

const reportLog =
    document.getElementById("reportLog");

const startButton =
    document.getElementById("startButton");


// ============================================================
// VARIABLES
// ============================================================

let session = null;

let latitude = null;
let longitude = null;

let detectionRunning = false;

let pendingReports = [];

let lastDetectionTime = 0;

let gpsWatcher = null;


// ============================================================
// NEW POTHOLE TRACKING VARIABLES
// ============================================================

let potholeTracks = [];

let nextTrackId = 1;


// ============================================================
// LOAD MODEL
// ============================================================

async function loadModel() {

    try {

        statusText.innerText =
            "Loading ONNX model...";


        session =
            await ort.InferenceSession.create(
                MODEL_PATH
            );


        console.log(
            "ONNX model loaded successfully"
        );


        console.log(
            "Inputs:",
            session.inputNames
        );


        console.log(
            "Outputs:",
            session.outputNames
        );


        statusText.innerText =
            "🟢 AI model loaded - ready";

    }

    catch (error) {

        console.error(
            "Model loading error:",
            error
        );


        statusText.innerText =
            "❌ AI model failed to load";

    }

}


// ============================================================
// START CAMERA + GPS + DETECTION
// ============================================================

async function startDetection() {

    if (!session) {

        alert(
            "AI model is still loading."
        );

        return;

    }


    if (detectionRunning) {

        return;

    }


    try {

        // ====================================================
        // CAMERA
        // ====================================================

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        // Wait until camera dimensions are available

        if (
            video.videoWidth === 0
        ) {

            await new Promise(
                resolve => {

                    video.onloadedmetadata =
                        resolve;

                }
            );

        }


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        // ====================================================
        // GPS
        // ====================================================

        if (
            "geolocation" in navigator
        ) {

            gpsWatcher =
                navigator.geolocation.watchPosition(

                    function(position) {

                        latitude =
                            position.coords.latitude;


                        longitude =
                            position.coords.longitude;


                        locationText.innerHTML =

                            "Latitude: " +

                            latitude.toFixed(6) +

                            "<br>" +

                            "Longitude: " +

                            longitude.toFixed(6);


                        console.log(
                            "GPS:",
                            latitude,
                            longitude
                        );

                    },


                    function(error) {

                        console.error(
                            "GPS error:",
                            error
                        );


                        locationText.innerText =
                            "❌ GPS unavailable";

                    },


                    {

                        enableHighAccuracy:
                            true,

                        maximumAge:
                            0,

                        timeout:
                            10000

                    }

                );

        }

        else {

            locationText.innerText =
                "❌ GPS not supported";

        }


        // ====================================================
        // START DETECTION
        // ====================================================

        detectionRunning =
            true;


        statusText.innerText =
            "🟢 Live AI detection running";


        startButton.innerText =
            "🟢 Detection Running";


        detectFrame();

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        alert(
            "Could not start camera."
        );

    }

}


// ============================================================
// DETECTION LOOP
// ============================================================

async function detectFrame() {

    if (!detectionRunning) {

        return;

    }


    try {

        if (

            video.readyState >= 2 &&

            video.videoWidth > 0

        ) {

            const detections =
                await runInference();


            drawDetections(
                detections
            );


            // =================================================
            // NEW:
            // Track potholes between frames
            // =================================================

            updatePotholeTracks(
                detections
            );

        }

    }

    catch (error) {

        console.error(
            "Detection error:",
            error
        );

    }


    requestAnimationFrame(
        detectFrame
    );

}


// ============================================================
// RUN ONNX INFERENCE
// ============================================================

async function runInference() {

    const size =
        INPUT_SIZE;


    const inputCanvas =
        document.createElement(
            "canvas"
        );


    inputCanvas.width =
        size;


    inputCanvas.height =
        size;


    const inputCtx =
        inputCanvas.getContext(
            "2d"
        );


    // Resize camera frame
    // to 640 x 640

    inputCtx.drawImage(

        video,

        0,
        0,

        size,
        size

    );


    const imageData =
        inputCtx.getImageData(

            0,
            0,

            size,
            size

        );


    const imageSize =
        size * size;


    const inputData =
        new Float32Array(

            3 * imageSize

        );


    // ========================================================
    // RGBA → RGB
    // ========================================================

    for (

        let i = 0;

        i < imageSize;

        i++

    ) {

        const pixel =
            i * 4;


        inputData[i] =
            imageData.data[pixel] /
            255.0;


        inputData[
            imageSize + i
        ] =
            imageData.data[pixel + 1] /
            255.0;


        inputData[
            2 * imageSize + i
        ] =
            imageData.data[pixel + 2] /
            255.0;

    }


    const inputTensor =
        new ort.Tensor(

            "float32",

            inputData,

            [
                1,
                3,
                size,
                size
            ]

        );


    const outputs =
        await session.run({

            images:
                inputTensor

        });


    const output =
        outputs.output0;


    const values =
        output.data;


    const numDetections =
        8400;


    const detections = [];


    // ========================================================
    // READ YOLO OUTPUT
    // ========================================================

    for (

        let i = 0;

        i < numDetections;

        i++

    ) {

        const confidence =
            values[
                4 * numDetections + i
            ];


        if (

            confidence <
            CONFIDENCE_THRESHOLD

        ) {

            continue;

        }


        const cx =
            values[i];


        const cy =
            values[
                numDetections + i
            ];


        const width =
            values[
                2 * numDetections + i
            ];


        const height =
            values[
                3 * numDetections + i
            ];


        detections.push({

            x:
                cx - width / 2,

            y:
                cy - height / 2,

            width:
                width,

            height:
                height,

            confidence:
                confidence

        });

    }


    return nonMaximumSuppression(
        detections
    );

}


// ============================================================
// NON-MAXIMUM SUPPRESSION
// ============================================================

function nonMaximumSuppression(
    detections
) {

    detections.sort(

        (a, b) =>
            b.confidence -
            a.confidence

    );


    const selected = [];


    while (

        detections.length > 0

    ) {

        const current =
            detections.shift();


        selected.push(
            current
        );


        detections =
            detections.filter(

                candidate =>

                    calculateIoU(

                        current,

                        candidate

                    ) <

                    NMS_IOU_THRESHOLD

            );

    }


    return selected;

}


// ============================================================
// IOU
// ============================================================

function calculateIoU(
    a,
    b
) {

    const x1 =
        Math.max(
            a.x,
            b.x
        );


    const y1 =
        Math.max(
            a.y,
            b.y
        );


    const x2 =
        Math.min(

            a.x + a.width,

            b.x + b.width

        );


    const y2 =
        Math.min(

            a.y + a.height,

            b.y + b.height

        );


    const intersectionWidth =
        Math.max(

            0,

            x2 - x1

        );


    const intersectionHeight =
        Math.max(

            0,

            y2 - y1

        );


    const intersection =
        intersectionWidth *
        intersectionHeight;


    const areaA =
        a.width *
        a.height;


    const areaB =
        b.width *
        b.height;


    const union =
        areaA +
        areaB -
        intersection;


    if (
        union <= 0
    ) {

        return 0;

    }


    return (
        intersection /
        union
    );

}


// ============================================================
// DRAW DETECTIONS
// ============================================================

function drawDetections(
    detections
) {

    // ========================================================
    // IMPORTANT CAMERA OVERLAY FIX
    // ========================================================

    if (

        canvas.width !==
        video.videoWidth ||

        canvas.height !==
        video.videoHeight

    ) {

        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;

    }


    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    const scaleX =
        canvas.width /
        INPUT_SIZE;


    const scaleY =
        canvas.height /
        INPUT_SIZE;


    for (

        const detection of
        detections

    ) {

        const x =
            detection.x *
            scaleX;


        const y =
            detection.y *
            scaleY;


        const width =
            detection.width *
            scaleX;


        const height =
            detection.height *
            scaleY;


        ctx.strokeStyle =
            "red";


        ctx.lineWidth =
            4;


        ctx.strokeRect(

            x,
            y,

            width,
            height

        );


        ctx.fillStyle =
            "red";


        ctx.font =
            "18px Arial";


        const percentage =

            (

                detection.confidence *
                100

            ).toFixed(1);


        ctx.fillText(

            "Pothole " +
            percentage +
            "%",

            x,

            Math.max(
                20,
                y - 5
            )

        );

    }

}


// ============================================================
// POTHOLE TRACKING
// ============================================================
//
// THIS IS THE NEW DUPLICATE-PREVENTION SYSTEM.
//
// It does NOT use GPS.
//
// It compares where the pothole appears inside the camera
// between consecutive frames.
//
// Same pothole:
//
// Frame 1 → Track #1
// Frame 2 → Track #1
// Frame 3 → Track #1
// Frame 4 → Track #1
//
// Only Frame 1 creates the report.
//

// ============================================================
// GET CENTER OF DETECTION
// ============================================================

function getDetectionCenter(
    detection
) {

    return {

        x:
            detection.x +
            detection.width / 2,

        y:
            detection.y +
            detection.height / 2

    };

}


// ============================================================
// DISTANCE BETWEEN TWO DETECTIONS
// ============================================================

function getDetectionDistance(
    detectionA,
    detectionB
) {

    const centerA =
        getDetectionCenter(
            detectionA
        );


    const centerB =
        getDetectionCenter(
            detectionB
        );


    const dx =
        centerA.x -
        centerB.x;


    const dy =
        centerA.y -
        centerB.y;


    return Math.sqrt(

        dx * dx +
        dy * dy

    );

}


// ============================================================
// UPDATE POTHOLE TRACKS
// ============================================================

function updatePotholeTracks(
    detections
) {

    const now =
        Date.now();


    const matchedTracks =
        new Set();


    // ========================================================
    // TRY TO MATCH EACH NEW DETECTION
    // WITH AN EXISTING POTHOLE
    // ========================================================

    for (

        const detection of
        detections

    ) {

        let closestTrack =
            null;


        let closestDistance =
            TRACK_DISTANCE_PIXELS + 1;


        // ----------------------------------------------------
        // Find nearest existing track
        // ----------------------------------------------------

        for (

            const track of
            potholeTracks

        ) {

            if (

                matchedTracks.has(
                    track.id
                )

            ) {

                continue;

            }


            const distance =
                getDetectionDistance(

                    detection,

                    track.lastDetection

                );


            if (

                distance <
                closestDistance

            ) {

                closestDistance =
                    distance;


                closestTrack =
                    track;

            }

        }


        // ====================================================
        // SAME POTHOLE FOUND
        // ====================================================

        if (
            closestTrack !== null
        ) {

            closestTrack.lastDetection =
                detection;


            closestTrack.lastSeen =
                now;


            closestTrack.confidence =
                Math.max(

                    closestTrack.confidence,

                    detection.confidence

                );


            matchedTracks.add(
                closestTrack.id
            );


            // IMPORTANT:
            //
            // DO NOT REPORT AGAIN.
            //
            // This is the actual duplicate prevention.

        }


        // ====================================================
        // NEW POTHOLE
        // ====================================================

        else {

            const newTrack = {

                id:
                    nextTrackId++,

                lastDetection:
                    detection,

                firstSeen:
                    now,

                lastSeen:
                    now,

                reported:
                    false,

                confidence:
                    detection.confidence

            };


            potholeTracks.push(
                newTrack
            );


            matchedTracks.add(
                newTrack.id
            );


            // Report this pothole ONCE

            handleNewPothole(
                newTrack
            );

        }

    }


    // ========================================================
    // REMOVE OLD TRACKS
    // ========================================================
    //
    // If the pothole hasn't been seen for 2 seconds,
    // we assume it has left the camera.
    //

    potholeTracks =
        potholeTracks.filter(

            track =>

                now -
                track.lastSeen
                <
                TRACK_LOST_TIME

        );

}


// ============================================================
// HANDLE NEW POTHOLE
// ============================================================

function handleNewPothole(
    track
) {

    if (
        track.reported
    ) {

        return;

    }


    track.reported =
        true;


    createPotholeReport(

        track.confidence

    );

}


// ============================================================
// CREATE POTHOLE REPORT
// ============================================================

function createPotholeReport(
    confidence
) {

    // ========================================================
    // GPS MUST BE AVAILABLE
    // ========================================================

    if (

        latitude === null ||
        longitude === null

    ) {

        console.log(

            "Pothole detected, " +
            "but GPS is not ready."

        );


        return;

    }


    const now =
        Date.now();


    // ========================================================
    // EXTRA SAFETY COOLDOWN
    // ========================================================

    if (

        now -
        lastDetectionTime
        <
        DETECTION_COOLDOWN

    ) {

        return;

    }


    lastDetectionTime =
        now;


    // ========================================================
    // REPORT PACKET
    // ========================================================

    const report = {

        bus_id:
            BUS_ID,

        latitude:
            Number(

                latitude.toFixed(6)

            ),

        longitude:
            Number(

                longitude.toFixed(6)

            ),

        confidence:
            Number(

                confidence.toFixed(2)

            )

    };


    pendingReports.push(
        report
    );


    updateReportCount();


    addDetectionToLog(
        report
    );


    console.log(
        "📦 New pothole report:",
        report
    );

}


// ============================================================
// UPDATE REPORT COUNT
// ============================================================

function updateReportCount() {

    reportCount.innerText =
        pendingReports.length;

}


// ============================================================
// DETECTION LOG
// ============================================================

function addDetectionToLog(
    report
) {

    const div =
        document.createElement(
            "div"
        );


    div.style.padding =
        "8px 0";


    div.style.borderBottom =
        "1px solid #444";


    div.innerHTML =

        "🕳️ Pothole detected" +

        "<br>📍 " +

        report.latitude +

        ", " +

        report.longitude +

        "<br>🎯 Confidence: " +

        (

            report.confidence *
            100

        ).toFixed(0) +

        "%";


    reportLog.prepend(
        div
    );

}


// ============================================================
// SEND REPORTS EVERY 60 SECONDS
// ============================================================

setInterval(

    sendReports,

    REPORT_INTERVAL

);


// ============================================================
// SEND REPORTS TO API
// ============================================================

async function sendReports() {

    if (

        pendingReports.length === 0

    ) {

        console.log(
            "No reports to send."
        );


        return;

    }


    const reportsToSend =
        [
            ...pendingReports
        ];


    console.log(

        "🚀 Sending reports:",

        reportsToSend

    );


    for (

        const report of
        reportsToSend

    ) {

        try {

            const response =
                await fetch(

                    API_URL,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                report
                            )

                    }

                );


            if (
                !response.ok
            ) {

                throw new Error(

                    "HTTP " +
                    response.status

                );

            }


            console.log(

                "✅ Report sent:",

                report

            );


            const index =
                pendingReports.indexOf(
                    report
                );


            if (
                index !== -1
            ) {

                pendingReports.splice(

                    index,

                    1

                );

            }


            lastSent.innerText =
                new Date()
                    .toLocaleString();


            updateReportCount();

        }


        catch (error) {

            console.error(

                "❌ Failed to send report:",

                error

            );


            console.log(

                "Report kept for retry:",

                report

            );

        }

    }

}


// ============================================================
// LOAD AI MODEL
// ============================================================

loadModel();

</script>

</body>
</html>
```
