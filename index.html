    120;

let pendingReports = [];

let lastDetectionTime = 0;

// VEHICLE TRACKING VARIABLES

// ============================================================

        // ====================================================

        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        }

                    },

                    audio: false

        video.srcObject =
            stream;


        await video.play();


        if (
            video.videoWidth === 0
        ) {

            await new Promise(
                resolve => {

                    video.onloadedmetadata =
                        resolve;

            );

        canvas.width =
            video.videoWidth;

            video.videoHeight;


        // ====================================================
        // GPS

        if (

        ) {

                                // ----------------------------

                                // ----------------------------

                                ) {

// ============================================================
// DETECTION LOOP
// ============================================================

async function detectFrame() {

    if (
        !detectionRunning
    ) {

        return;

    }


    try {

        if (

            video.readyState >= 2 &&

            video.videoWidth > 0

        ) {

            const results =
                await runInference();


            drawDetections(
                results
            );


            updatePotholeTracks(
                results.potholes
            );


            updateVehicleTracks(
                results.vehicles
            );

        }

    }

    catch (error) {

        console.error(
            "Detection error:",
            error
        );

    }


    requestAnimationFrame(
        detectFrame
    );

}


// ============================================================
// RUN ONNX INFERENCE
// ============================================================

async function runInference() {

    const size =
        INPUT_SIZE;


    const inputCanvas =
        document.createElement(
            "canvas"
        );


    inputCanvas.width =
        size;

    inputCanvas.height =
        size;


    const inputCtx =
        inputCanvas.getContext(
            "2d"
        );


    inputCtx.drawImage(

        video,

        0,
        0,

        size,
        size

    );


    const imageData =
        inputCtx.getImageData(

            0,
            0,

            size,
            size

        );


    const imageSize =
        size * size;


    const inputData =
        new Float32Array(

            3 * imageSize

        );


    // ========================================================
    // RGBA → RGB
    // ========================================================

    for (

        let i = 0;

        i < imageSize;

        i++

    ) {

        const pixel =
            i * 4;


        inputData[i] =
            imageData.data[pixel] /
            255.0;


        inputData[
            imageSize + i
        ] =
            imageData.data[pixel + 1] /
            255.0;


        inputData[
            2 * imageSize + i
        ] =
            imageData.data[pixel + 2] /
            255.0;

    }


    const inputTensor =
        new ort.Tensor(

            "float32",

            inputData,

            [
                1,
                3,
                size,
                size
            ]

        );


    // ========================================================
    // POTHOLE MODEL
    // ========================================================

    const potholeOutputs =
        await session.run({

            images:
                inputTensor

        });


    const potholeOutput =
        potholeOutputs.output0;


    const potholes =
        parsePotholeDetections(
            potholeOutput
        );


    // ========================================================
    // VEHICLE MODEL
    // ========================================================

    const vehicleOutputs =
        await vehicleSession.run({

            images:
                inputTensor

        });


    const vehicleOutput =
        vehicleOutputs.output0;


    const vehicles =
        parseVehicleDetections(
            vehicleOutput
        );


    return {

        potholes:
            nonMaximumSuppression(
                potholes
            ),

        vehicles:
            vehicleNonMaximumSuppression(
                vehicles
            )

    };

}


// ============================================================
// PARSE POTHOLE DETECTIONS
// ============================================================

function parsePotholeDetections(
    output
) {

    const values =
        output.data;

    const numDetections =
        8400;

    const detections =
        [];


    for (

        let i = 0;

        i < numDetections;

        i++

    ) {

        const confidence =
            values[
                4 * numDetections + i
            ];


        if (
            confidence <
            CONFIDENCE_THRESHOLD
        ) {

            continue;

        }


        const cx =
            values[i];


        const cy =
            values[
                numDetections + i
            ];


        const width =
            values[
                2 * numDetections + i
            ];


        const height =
            values[
                3 * numDetections + i
            ];


        detections.push({

            x:
                cx - width / 2,

            y:
                cy - height / 2,

            width:
                width,

            height:
                height,

            confidence:
                confidence

        });

    }


    return detections;

}


// ============================================================
// PARSE VEHICLE DETECTIONS
// ============================================================

function parseVehicleDetections(
    output
) {

    const data =
        output.data;

    const numDetections =
        8400;

    const numClasses =
        80;


    const VEHICLE_CLASSES = {

        2:
            "Car",

        3:
            "Motorcycle",

        5:
            "Bus",

        7:
            "Truck"

    };


    const detections =
        [];


    for (

        let i = 0;

        i < numDetections;

        i++

    ) {

        const cx =
            data[i];


        const cy =
            data[
                numDetections + i
            ];


        const width =
            data[
                2 * numDetections + i
            ];


        const height =
            data[
                3 * numDetections + i
            ];


        let bestClass =
            -1;


        let bestConfidence =
            0;


        for (

            let c = 0;

            c < numClasses;

            c++

        ) {

            const confidence =
                data[
                    (4 + c) *
                    numDetections +
                    i
                ];


            if (
                confidence >
                bestConfidence
            ) {

                bestConfidence =
                    confidence;

                bestClass =
                    c;

            }

        }


        if (

            VEHICLE_CLASSES[
                bestClass
            ] &&

            bestConfidence >=
            VEHICLE_CONFIDENCE_THRESHOLD

        ) {

            detections.push({

                x:
                    cx - width / 2,

                y:
                    cy - height / 2,

                width:
                    width,

                height:
                    height,

                confidence:
                    bestConfidence,

                classId:
                    bestClass,

                className:
                    VEHICLE_CLASSES[
                        bestClass
                    ]

            });

        }

    }


    return detections;

}


// ============================================================
// VEHICLE NMS
// ============================================================

function vehicleNonMaximumSuppression(
    detections
) {

    detections.sort(

        (a, b) =>
            b.confidence -
            a.confidence

    );


    const selected =
        [];


    while (
        detections.length > 0
    ) {

        const current =
            detections.shift();


        selected.push(
            current
        );


        detections =
            detections.filter(

                candidate =>

                    calculateIoU(
                        current,
                        candidate
                    ) <
                    NMS_IOU_THRESHOLD

            );

    }


    return selected;

}


// ============================================================
// POTHOLE NMS
// ============================================================

function nonMaximumSuppression(
    detections
) {

    detections.sort(

        (a, b) =>
            b.confidence -
            a.confidence

    );


    const selected =
        [];


    while (
        detections.length > 0
    ) {

        const current =
            detections.shift();


        selected.push(
            current
        );


        detections =
            detections.filter(

                candidate =>

                    calculateIoU(
                        current,
                        candidate
                    ) <
                    NMS_IOU_THRESHOLD

            );

    }


    return selected;

}


// ============================================================
// IOU
// ============================================================

function calculateIoU(
    a,
    b
) {

    const x1 =
        Math.max(
            a.x,
            b.x
        );


    const y1 =
        Math.max(
            a.y,
            b.y
        );


    const x2 =
        Math.min(

            a.x + a.width,

            b.x + b.width

        );


    const y2 =
        Math.min(

            a.y + a.height,

            b.y + b.height

        );


    const intersectionWidth =
        Math.max(
            0,
            x2 - x1
        );


    const intersectionHeight =
        Math.max(
            0,
            y2 - y1
        );


    const intersection =
        intersectionWidth *
        intersectionHeight;


    const areaA =
        a.width *
        a.height;


    const areaB =
        b.width *
        b.height;


    const union =
        areaA +
        areaB -
        intersection;


    if (
        union <= 0
    ) {

        return 0;

    }


    return (
        intersection /
        union
    );

}


// ============================================================
// DRAW DETECTIONS
// ============================================================

function drawDetections(
    results
) {

    const potholes =
        results.potholes;


    const vehicles =
        results.vehicles;


    if (

        canvas.width !==
        video.videoWidth ||

        canvas.height !==
        video.videoHeight

    ) {

        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;

    }


    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    const scaleX =
        canvas.width /
        INPUT_SIZE;


    const scaleY =
        canvas.height /
        INPUT_SIZE;


    // ========================================================
    // VEHICLES
    // ========================================================

    for (
        const detection of
        vehicles
    ) {

        const x =
            detection.x *
            scaleX;


        const y =
            detection.y *
            scaleY;


        const width =
            detection.width *
            scaleX;


        const height =
            detection.height *
            scaleY;


        ctx.strokeStyle =
            "blue";


        ctx.lineWidth =
            4;


        ctx.strokeRect(
            x,
            y,
            width,
            height
        );


        ctx.fillStyle =
            "blue";


        ctx.font =
            "18px Arial";


        const percentage =
            (
                detection.confidence *
                100
            ).toFixed(1);


        ctx.fillText(

            detection.className +
            " " +
            percentage +
            "%",

            x,

            Math.max(
                20,
                y - 5
            )

        );

    }


    // ========================================================
    // POTHOLES
    // ========================================================

    for (
        const detection of
        potholes
    ) {

        const x =
            detection.x *
            scaleX;


        const y =
            detection.y *
            scaleY;


        const width =
            detection.width *
            scaleX;


        const height =
            detection.height *
            scaleY;


        ctx.strokeStyle =
            "red";


        ctx.lineWidth =
            4;


        ctx.strokeRect(
            x,
            y,
            width,
            height
        );


        ctx.fillStyle =
            "red";


        ctx.font =
            "18px Arial";


        const percentage =
            (
                detection.confidence *
                100
            ).toFixed(1);


        ctx.fillText(

            "Pothole " +
            percentage +
            "%",

            x,

            Math.max(
                20,
                y - 5
            )

        );

    }

}


// ============================================================
// VEHICLE TRACKING
// ============================================================

function updateVehicleTracks(
    detections
) {

    const now =
        Date.now();


    const matchedTracks =
        new Set();


    for (
        const detection of
        detections
    ) {

        let closestTrack =
            null;


        let closestDistance =
            VEHICLE_TRACK_DISTANCE_PIXELS + 1;


        for (
            const track of
            vehicleTracks
        ) {

            if (
                matchedTracks.has(
                    track.id
                )
            ) {

                continue;

            }


            const distance =
                getDetectionDistance(

                    detection,

                    track.lastDetection

                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closestTrack =
                    track;

            }

        }


        if (
            closestTrack !== null
        ) {

            closestTrack.lastDetection =
                detection;


            closestTrack.lastSeen =
                now;

        }

        else {

            const newTrack = {

                id:
                    nextVehicleTrackId++,

                segmentId:
                    nextVehicleSegmentId++,

                lastDetection:
                    detection,

                firstSeen:
                    now,

                lastSeen:
                    now,

                className:
                    detection.className

            };


            vehicleTracks.push(
                newTrack
            );


            // ----------------------------------------------
            // Count this vehicle once for current 1-km
            // segment
            // ----------------------------------------------

            segmentVehicleIds.add(
                newTrack.segmentId
            );


            updateVehicleCount();

        }

    }


    vehicleTracks =
        vehicleTracks.filter(

            track =>

                now -
                track.lastSeen
                <
                VEHICLE_TRACK_LOST_TIME

        );

}


// ============================================================
// VEHICLE COUNT DISPLAY
// ============================================================

function updateVehicleCount() {

    vehicleCountText.innerText =
        segmentVehicleIds.size;

}


// ============================================================
// START NEW 1 KM SEGMENT
// ============================================================

function startNewVehicleSegment() {

    segmentStartLatitude =
        latitude;

    segmentStartLongitude =
        longitude;

    segmentDistanceKm =
        0;

    segmentVehicleIds =
        new Set();

    vehicleTracks =
        [];

    updateVehicleCount();

    updateSegmentDistance();

    console.log(
        "🛣️ New 1 km vehicle segment started."
    );

}


// ============================================================
// COMPLETE 1 KM VEHICLE SEGMENT
// ============================================================

function completeVehicleSegment() {

    if (
        latitude === null ||
        longitude === null
    ) {

        return;

    }


    const vehicleCount =
        segmentVehicleIds.size;


    const report = {

        bus_id:
            BUS_ID,

        latitude:
            Number(
                latitude.toFixed(6)
            ),

        longitude:
            Number(
                longitude.toFixed(6)
            ),

        vehicle_count:
            vehicleCount,

        timestamp:
            new Date().toISOString()

    };


    console.log(
        "🚗 1 km vehicle report:",
        report
    );


    sendVehicleReport(
        report
    );


    // --------------------------------------------------------
    // Start next 1 km segment
    // --------------------------------------------------------

    segmentDistanceKm =
        0;

    segmentVehicleIds =
        new Set();

    vehicleTracks =
        [];

    updateVehicleCount();

    updateSegmentDistance();


    segmentStartLatitude =
        latitude;

    segmentStartLongitude =
        longitude;

}


// ============================================================
// DISTANCE BETWEEN GPS COORDINATES
// ============================================================

function calculateDistanceKm(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const earthRadiusKm =
        6371;


    const dLat =
        degreesToRadians(
            lat2 - lat1
        );


    const dLon =
        degreesToRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            degreesToRadians(lat1)
        ) *

        Math.cos(
            degreesToRadians(lat2)
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return (
        earthRadiusKm *
        c
    );

}


// ============================================================

// ============================================================
// POTHOLE TRACKING
// ============================================================

function getDetectionCenter(
    detection
) {

    return {

        x:
            detection.x +
            detection.width / 2,

        y:
            detection.y +
            detection.height / 2

    };

}


// ============================================================
// DISTANCE BETWEEN DETECTIONS
// ============================================================

function getDetectionDistance(
    detectionA,
    detectionB
) {

    const centerA =
        getDetectionCenter(
            detectionA
        );


    const centerB =
        getDetectionCenter(
            detectionB
        );


    const dx =
        centerA.x -
        centerB.x;


    const dy =
        centerA.y -
        centerB.y;


    return Math.sqrt(

        dx * dx +
        dy * dy

    );

}


// ============================================================
// UPDATE POTHOLE TRACKS
// ============================================================

function updatePotholeTracks(
    detections
) {

    const now =
        Date.now();


    const matchedTracks =
        new Set();


    for (
        const detection of
        detections
    ) {

        let closestTrack =
            null;


        let closestDistance =
            TRACK_DISTANCE_PIXELS + 1;


        for (
            const track of
            potholeTracks
        ) {

            if (
                matchedTracks.has(
                    track.id
                )
            ) {

                continue;

            }


            const distance =
                getDetectionDistance(

                    detection,

                    track.lastDetection

                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closestTrack =
                    track;

            }

        }


        if (
            closestTrack !== null
        ) {

            closestTrack.lastDetection =
                detection;


            closestTrack.lastSeen =
                now;


            closestTrack.confidence =
                Math.max(

                    closestTrack.confidence,

                    detection.confidence

                );


            matchedTracks.add(
                closestTrack.id
            );

        }

        else {

            const newTrack = {

                id:
                    nextTrackId++,

                lastDetection:
                    detection,

                firstSeen:
                    now,

                lastSeen:
                    now,

                reported:
                    false,

                confidence:
                    detection.confidence

            };


            potholeTracks.push(
                newTrack
            );


            matchedTracks.add(
                newTrack.id
            );


            handleNewPothole(
                newTrack
            );

        }

    }


    potholeTracks =
        potholeTracks.filter(

            track =>

                now -
                track.lastSeen
                <
                TRACK_LOST_TIME

        );

}


// ============================================================
// HANDLE NEW POTHOLE
// ============================================================

function handleNewPothole(
    track
) {

    if (
        track.reported
    ) {

        return;

    }


    track.reported =
        true;


    createPotholeReport(
        track.confidence
    );

}


// ============================================================
// CREATE POTHOLE REPORT
// ============================================================

function createPotholeReport(
    confidence
) {

    if (

        latitude === null ||
        longitude === null

    ) {

        console.log(
            "Pothole detected, but GPS is not ready."
        );

        return;

    }


    const now =
        Date.now();


    if (

        now -
        lastDetectionTime
        <
        DETECTION_COOLDOWN

    ) {

        return;

    }


    lastDetectionTime =
        now;


    const report = {

        bus_id:
            BUS_ID,

        latitude:
            Number(
                latitude.toFixed(6)
            ),

        longitude:
            Number(
                longitude.toFixed(6)
            ),

        confidence:
            Number(
                confidence.toFixed(2)
            )

    };


    pendingReports.push(
        report
    );


    updateReportCount();


    addDetectionToLog(
        report
    );


    console.log(
        "📦 New pothole report:",
        report
    );

}

async function sendReports() {

        pendingReports.length === 0
    ) {

        console.log(

        );

        return;

    }


    const reportsToSend =
        [

        ];


    console.log(
        "🚀 Sending pothole reports:",
        reportsToSend
    );


    for (
        const report of
        reportsToSend
    ) {

        try {

            const response =
                await fetch(

                    API_URL,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(

                            )

                    }

                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            console.log(
                "✅ Pothole report sent:",
                report
            );


            const index =
                pendingReports.indexOf(
                    report
                );


            if (

            ) {

                pendingReports.splice(

                );

            }


            lastSent.innerText =
                new Date()

            updateReportCount();

        catch (error) {

            console.error(

            console.log(

                report
            );

        }

    }

}
