<!DOCTYPE html>
<html>
<head>

    <title>PotholeWatch</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <h1>🕳️ PotholeWatch</h1>

    <p class="subtitle">Road condition detection</p>


    <!-- CAMERA / PHOTO -->

    <div class="camera-box">

        <video id="camera" autoplay playsinline></video>

        <canvas id="photo"></canvas>

    </div>


    <!-- BUTTONS -->

    <button class="start-button" onclick="startCamera()">
        📷 Start Camera
    </button>

    <button class="capture-button" onclick="takePhoto()">
        📸 Take Photo
    </button>


    <!-- LOCATION -->

    <div class="info">

        <h3>📍 Location</h3>

        <p id="location">
            Not captured
        </p>

    </div>


    <!-- TIME -->

    <div class="info">

        <h3>🕐 Time</h3>

        <p id="time">
            Not captured
        </p>

    </div>

</div>


<script>


// =========================
// CAMERA
// =========================

let camera = document.getElementById("camera");

let photo = document.getElementById("photo");


function startCamera() {

    navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: "environment"
        }

    })

    .then(function(stream) {

        camera.srcObject = stream;

        // Show camera
        camera.style.display = "block";

        // Hide captured photo
        photo.style.display = "none";

    })

    .catch(function(error) {

        alert("Camera permission denied.");

    });

}


// =========================
// TAKE PHOTO
// =========================

function takePhoto() {

    let context = photo.getContext("2d");


    // Match photo size with camera

    photo.width = camera.videoWidth;

    photo.height = camera.videoHeight;


    // Capture image

    context.drawImage(

        camera,

        0,
        0,

        photo.width,
        photo.height

    );


    // Hide live camera

    camera.style.display = "none";


    // Show captured photo

    photo.style.display = "block";


    // Convert image

    let imageData = photo.toDataURL("image/jpeg");


    // =========================
    // GET LOCATION
    // =========================

    navigator.geolocation.getCurrentPosition(

        function(position) {

            let latitude = position.coords.latitude;

            let longitude = position.coords.longitude;

            let currentTime = new Date().toISOString();


            // Create pothole data

            let potholeData = {

                image: imageData,

                latitude: latitude,

                longitude: longitude,

                time: currentTime

            };


            // Show location

            document.getElementById("location").innerHTML =

                "Latitude: " + latitude.toFixed(6) +

                "<br>" +

                "Longitude: " + longitude.toFixed(6);


            // Show time

            document.getElementById("time").innerHTML =

                new Date().toLocaleString();


            console.log(potholeData);

        },


        function(error) {

            document.getElementById("location").innerHTML =

                "❌ Location unavailable";

        }

    );

}

</script>

</body>
</html>
