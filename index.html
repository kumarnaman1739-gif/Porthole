<!DOCTYPE html>
<html>
<head>
    <title>Pothole Detector</title>
</head>

<body>

    <h1>Pothole Detection</h1>

    <!-- GPS -->
    <button onclick="getLocation()">
        Get My Location
    </button>

    <p id="location">Location not found</p>


    <!-- Camera -->
    <h2>Camera</h2>

    <video id="camera" width="300" autoplay playsinline></video>

    <br><br>

    <button onclick="startCamera()">
        Start Camera
    </button>

    <button onclick="takePhoto()">
        Take Photo
    </button>

    <br><br>

    <canvas id="photo" width="300"></canvas>


    <script>

    // =========================
    // GPS
    // =========================

    function getLocation() {

        navigator.geolocation.getCurrentPosition(

            function(position) {

                let latitude = position.coords.latitude;
                let longitude = position.coords.longitude;

                document.getElementById("location").innerHTML =
                    "Latitude: " + latitude +
                    "<br>Longitude: " + longitude;
            },

            function(error) {

                document.getElementById("location").innerHTML =
                    "Could not get location.";
            }
        );
    }


    // =========================
    // CAMERA
    // =========================

    let camera = document.getElementById("camera");

    function startCamera() {

        navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "environment"
            }

        })

        .then(function(stream) {

            camera.srcObject = stream;

        })

        .catch(function(error) {

            alert("Camera permission denied or camera not available.");

        });
    }


    // =========================
    // TAKE PHOTO
    // =========================

    function takePhoto() {

        let canvas = document.getElementById("photo");

        let context = canvas.getContext("2d");

        context.drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    </script>

</body>
</html>
