<!DOCTYPE html>
<html>
<head>

    <title>Pothole Detection</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">

        <!-- HEADER -->

        <div class="header">

            <div>
                <h1>🕳️ Pothole<span>Watch</span></h1>
                <p>Road condition detection</p>
            </div>

            <div class="status-dot"></div>

        </div>


        <!-- CAMERA -->

        <div class="camera-card">

            <video id="camera" autoplay playsinline></video>

            <div class="camera-label">
                📷 Live Camera
            </div>

        </div>


        <!-- CAMERA BUTTON -->

        <button class="primary-button" onclick="startCamera()">
            📷 Start Camera
        </button>


        <!-- LOCATION CARD -->

        <div class="info-card">

            <div class="card-title">
                📍 Current Location
            </div>

            <p id="location">
                Location not captured
            </p>

        </div>


        <!-- PHOTO -->

        <div class="photo-section">

            <h2>Captured Image</h2>

            <canvas id="photo"></canvas>

        </div>


        <!-- TAKE PHOTO -->

        <button class="capture-button" onclick="takePhoto()">
            <span>📸</span>
            Detect Road
        </button>


        <!-- TIME -->

        <div class="info-card">

            <div class="card-title">
                🕐 Detection Time
            </div>

            <p id="time">
                Time not captured
            </p>

        </div>


        <!-- STATUS -->

        <div class="status-card">

            <div class="status-icon">
                ✓
            </div>

            <div>
                <strong>System Ready</strong>
                <p>Camera and GPS available</p>
            </div>

        </div>


        <!-- DATA -->

        <pre id="data"></pre>

    </div>


<script>


// =========================
// CAMERA
// =========================

let camera = document.getElementById("camera");


function startCamera() {

    navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: "environment"
        }

    })

    .then(function(stream) {

        camera.srcObject = stream;

    })

    .catch(function(error) {

        alert("Camera permission denied or camera not available.");

    });

}


// =========================
// TAKE PHOTO
// =========================

function takePhoto() {

    let canvas = document.getElementById("photo");

    let context = canvas.getContext("2d");


    // Capture camera frame

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    context.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Convert image

    let imageData = canvas.toDataURL("image/jpeg");


    // =========================
    // GET GPS
    // =========================

    navigator.geolocation.getCurrentPosition(

        function(position) {

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            let currentTime = new Date().toISOString();


            // Create pothole data

            let potholeData = {

                image: imageData,

                latitude: latitude,

                longitude: longitude,

                time: currentTime

            };


            // Show location

            document.getElementById("location").innerHTML =

                "Latitude: " + latitude.toFixed(6) +
                "<br>" +
                "Longitude: " + longitude.toFixed(6);


            // Show time

            document.getElementById("time").innerHTML =

                new Date().toLocaleString();


            // Show data in console

            console.log(potholeData);

        },


        function(error) {

            document.getElementById("location").innerHTML =
                "❌ Could not get location.";

        }

    );

}

</script>

</body>
</html>
